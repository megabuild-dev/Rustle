[package]
name = "rustle-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rustle"

[[bin]]
name = "rustle"
path = "src/main.rs"

[features]
default = []
# Serve with in-memory fake Docker/Caddy backends (RSS smoke tests, local UI dev).
dev-fakes = []

[dependencies]
rustle-types = { path = "../rustle-types" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "signal", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper = { version = "1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
rust-embed = "8"
urlencoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
