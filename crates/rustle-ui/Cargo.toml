[package]
name = "rustle-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustle-types = { path = "../rustle-types" }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Document", "Window", "HtmlDocument", "Navigator", "Clipboard", "Location"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
