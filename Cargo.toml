[workspace]
resolver = "2"
members = ["crates/rustle-types", "crates/rustle-server", "crates/rustle-ui"]
default-members = ["crates/rustle-types", "crates/rustle-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["megalabs-dev and Rustle contributors"]
description = "Ultra-light self-hosted PaaS for small VPSs: deploy stateless Next.js/Node apps from GHCR images behind Caddy, with the platform itself under 8 MB of RAM."
repository = "https://github.com/megalabs-dev/rustle"
homepage = "https://github.com/megalabs-dev/rustle"
readme = "README.md"
keywords = ["paas", "self-hosted", "deployment", "caddy", "docker"]
categories = ["command-line-utilities", "web-programming::http-server"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

# Dependencies (argon2, ring, sqlite) are slow unoptimized and dominate test time; our own code stays debug.
[profile.dev.package."*"]
opt-level = 2
