# cargo-mutants configuration (see docs/QUALITY.md)
# Mutants that cannot be observed from a test are excluded here, each with its reason.
exclude_re = [
  # Only returns freed heap pages to the OS (malloc_trim); no observable behaviour. Its effect is
  # measured by scripts/rss_smoke.py.
  "replace release_memory with \\(\\)",
  # Process-global side effects at startup (allocator arenas, global logger) and the blocking serve
  # entry point; exercised by scripts/e2e-*.sh and scripts/rss_smoke.py, not by unit tests.
  "replace tune_allocator with \\(\\)",
  "replace init_logging with \\(\\)",
  "replace serve -> u8 with",
  # Needs a real SIGTERM / SIGINT delivered to the process; covered by the systemd and e2e scripts.
  "replace shutdown_signal with \\(\\)",
  "replace run -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
]
