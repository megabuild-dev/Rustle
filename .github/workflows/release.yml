name: Release

# Tag a version (v0.1.0) whose number matches crates/rustle-server/Cargo.toml.
# Needs: secret RUSTLE_SIGNING_KEY in the protected "release" environment (PEM, see docs/RELEASING.md) and
#        repository variable RUSTLE_UPDATE_PUBKEY_HEX (64 hex chars, the matching public key).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the crate version
        run: |
          V="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != workspace version v$V"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk and the matching wasm-bindgen
        run: |
          cargo install trunk --locked
          WB="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,"",$3); print $3; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$WB" --locked
      - run: pip install brotli
      - run: ./scripts/build-ui.sh
      - name: Build the server
        env:
          RUSTLE_UPDATE_PUBKEY_HEX: ${{ vars.RUSTLE_UPDATE_PUBKEY_HEX }}
        run: |
          [ -n "$RUSTLE_UPDATE_PUBKEY_HEX" ] || { echo "RUSTLE_UPDATE_PUBKEY_HEX variable is not set"; exit 1; }
          cargo build --release -p rustle-server
          cp target/release/rustle "rustle-${{ matrix.arch }}-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: rustle-${{ matrix.arch }}
          path: rustle-${{ matrix.arch }}-linux

  # The signing key never shares a job with build tooling (cargo, trunk and their dependencies):
  # this job only signs files it downloads, and requires the protected "release" environment.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign (Ed25519 over a manifest of version, architecture and SHA-256)
        env:
          KEY: ${{ secrets.RUSTLE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/pub.pem"
          for arch in x86_64 aarch64; do
            f="dist/rustle-$arch-linux"
            printf 'rustle-release-v1\n%s\n%s\n%s\n' "$TAG" "$arch" "$(sha256sum "$f" | cut -d' ' -f1)" > "$RUNNER_TEMP/manifest-$arch.txt"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/manifest-$arch.txt" -out "$f.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/pub.pem" -in "$RUNNER_TEMP/manifest-$arch.txt" -sigfile "$f.sig"
          done
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Checksums and installer bundle
        run: |
          cd dist
          sha256sum rustle-*-linux > SHA256SUMS
          cd ..
          tar czf dist/rustle-installer.tar.gz install deploy
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
