# cargo-deny: licences, advisories, bans and sources. Run: cargo deny check
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is a compile-time macro pulled in by the Leptos dashboard (rustle-ui). It is unmaintained but
  # archived, not vulnerable, and is not part of the server binary. Revisit when Leptos drops it.
  { id = "RUSTSEC-2024-0436", reason = "build-time macro in the dashboard crate only; no vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Everything shipped in the binary must be compatible with distributing Rustle under MIT.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace-internal path dependencies

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
